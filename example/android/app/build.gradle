apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    entryFile = file("../../index.js")
    hermesCommand = file("../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc").absolutePath
    extraPackagerArgs = ["--max-workers", "2"]
    autolinkLibrariesWithApp()
}

// The RN bundle task watches JS/TS only under the example root by default.
// Our imported library sources and shared .mjs harness live outside that root.
// Declare them explicitly so incremental Release builds cannot package stale code.
tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach {
    inputs.files(fileTree("../../../src") { include "**/*.ts", "**/*.tsx" })
    inputs.files(fileTree("../../../benchmark") { include "*.mjs" })
    inputs.file(file("../../fixtures/manifest.json"))
}

android {
    namespace "com.skiawebgpuvideo.tests"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        applicationId "com.skiawebgpuvideo.tests"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters(*providers.gradleProperty("reactNativeArchitectures").getOrElse("arm64-v8a").split(",")) }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    sourceSets { main.assets.srcDirs += ["../../fixtures"] }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            // Qualification only. No release signing configuration is supplied.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
